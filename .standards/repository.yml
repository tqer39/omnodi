{
  "schemaVersion": 1,
  "standard": {
    "repository": "tqer39/dev-standards",
    "version": "0.4.15"
  },
  "platforms": [
    "macos",
    "linux",
    "windows"
  ],
  "components": [
    {
      "name": "main",
      "path": ".",
      "profile": "node-npm"
    }
  ],
  "ai": {
    "targets": [
      "codexcli"
    ],
    "instructions": "rulesync"
  },
  "gitignore": {
    "templates": [
      "node",
      "linux",
      "macos",
      "windows"
    ],
    "local": ".standards/gitignore.local"
  },
  "update": {
    "channel": "stable",
    "allowMajor": false,
    "rollout": "standard"
  },
  "ci": {
    "prBudgetSeconds": 600,
    "minimumSamples": 20,
    "breachWindows": 2
  }
}
